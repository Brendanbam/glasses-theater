name: Build Glasses Theater

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build signed APK
        run: gradle assembleRelease -PbuildNumber=${{ github.run_number }} --no-daemon

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk GlassesTheater-v1.0.${{ github.run_number }}.apk

      - name: Publish release for Obtainium
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Glasses Theater v1.0.${{ github.run_number }}
          body: Manga (Mihon downloads) and Cinema for XR glasses. Install with Obtainium or download the APK below.
          files: GlassesTheater-v1.0.${{ github.run_number }}.apk
